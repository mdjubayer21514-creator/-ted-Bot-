<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Qtex Bot</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}.box{background:#1a1a1a;padding:25px;border-radius:20px;border:1px solid #00ff88}.price{font-size:36px;color:#00ff88}.signal{font-size:24px;font-weight:bold;padding:15px;border-radius:10px;margin-top:10px}.up{background:#00ff8820;color:#00ff88}.down{background:#ff444420;color:#ff4444}button{padding:14px 30px;background:#00ff88;border:0;border-radius:12px;font-weight:bold;margin-top:15px}</style></head><body><h2>🤖 Qtex Live Bot</h2><div class="box"><div>EUR/USD</div><div class="price" id="price">1.08500</div><div id="sig" class="signal up">Analyzing...</div><div id="rsi" style="color:gray;margin-top:10px">RSI: --</div></div><button onclick="make()">🔄 New Signal</button><script>let p=1.0850;function make(){p+=(Math.random()-0.5)*0.0015;document.getElementById('price').innerText=p.toFixed(5);let rsi=Math.floor(Math.random()*100);document.getElementById('rsi').innerText='RSI: '+rsi;let s=document.getElementById('sig');if(rsi<30){s.innerText='🟢 UP - BUY';s.className='signal up';}else if(rsi>70){s.innerText='🔴 DOWN - SELL';s.className='signal down';}else{s.innerText='⏳ WAIT';s.style.background='#ffff0020';s.style.color='yellow';}}setInterval(make,2000);make();</script></body></html>
